name: Documentation & Schema Viewer

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # No container — deps installed from release packages below.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build tools and Doxygen
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config doxygen graphviz

      - name: Install reflectcpp
        env:
          GH_TOKEN: ${{ secrets.RATOS_RELEASE_TOKEN }}
        run: |
          tag=$(grep '^RATOS_RELEASE_TAG=' .commrat.env | cut -d= -f2)
          gh release download "${tag}" --repo mattih11/RaTOS \
            --pattern "reflectcpp_*_amd64.deb" --dir /tmp/pkgs
          sudo dpkg -i /tmp/pkgs/reflectcpp_*_amd64.deb

      - name: Install SeRTial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo mattih11/SeRTial \
            --pattern "sertial_*_amd64.deb" --dir /tmp/pkgs
          sudo dpkg -i /tmp/pkgs/sertial_*_amd64.deb

      - name: Install CoreRaT (STD)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo mattih11/CoreRaT \
            --pattern "corerat-std_*_amd64.deb" --dir /tmp/pkgs
          sudo dpkg -i /tmp/pkgs/corerat-std_*_amd64.deb

      - name: Generate Doxygen documentation
        run: doxygen Doxyfile

      # Build the schema-gen driver and emit all_examples_schema.json.
      # Only the schema_gen executable itself needs to run — no router required.
      - name: Generate AllExamplesApp schema JSON
        run: |
          cmake --preset default -DCOMMRAT_BUILD_TESTS=OFF
          cmake --build --preset default --target introspection_example_schema_gen --parallel $(nproc)
          # Run the driver directly (post-build command is not triggered here)
          build/default/examples/introspection_example_schema_gen
          echo "Schema written to build/default/examples/all_examples_schema.json"
          python3 -c "
          import json, sys
          d = json.load(open('build/default/examples/all_examples_schema.json'))
          user = [m for m in d['messages'] if not m['commrat']['payload_type'].startswith('commrat::')]
          print(f'Schema OK: {len(d[\"messages\"])} total entries, {len(user)} user types')
          "

      - name: Assemble GitHub Pages site
        run: |
          mkdir -p _site/api
          cp -r docs/api/html/. _site/api/

          # CommRaT inspect viewer + pre-built schema
          mkdir -p _site/commrat-inspect
          cp tools/commrat-inspect/viewer.html _site/commrat-inspect/
          cp build/default/examples/all_examples_schema.json \
             _site/commrat-inspect/all_examples_schema.json

          # Landing page that auto-redirects to the viewer with the example schema
          cat > _site/commrat-inspect/index.html <<'EOF'
          <!DOCTYPE html>
          <html><head><meta charset="UTF-8">
          <meta http-equiv="refresh" content="0; url=viewer.html?schema=all_examples_schema.json">
          <title>CommRaT Schema Viewer</title></head>
          <body>
          <p>Redirecting to <a href="viewer.html?schema=all_examples_schema.json">CommRaT Schema Viewer</a>...</p>
          </body></html>
          EOF

          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
