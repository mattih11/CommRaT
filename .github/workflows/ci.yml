name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# STD platform: bare ubuntu-latest, deps installed from release .deb packages.
# EVL platform: uses the RaTOS ISAR SDK and QEMU (no container).
#
# Required GitHub Actions secrets (repo Settings -> Secrets -> Actions):
#   RATOS_RELEASE_TOKEN  PAT with actions:read scope on mattih11/RaTOS
#                        (needed to download SDK, QEMU artifacts, and reflectcpp .deb)

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and test with the standard Linux platform backend.
  #        Runs on bare ubuntu-latest. Dependencies (reflectcpp, SeRTial,
  #        CoreRaT STD) are installed from their GitHub release .deb packages.
  # ---------------------------------------------------------------------------
  build-std:
    name: Build & Test (STD platform)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config

      - name: Install reflectcpp
        env:
          GH_TOKEN: ${{ secrets.RATOS_RELEASE_TOKEN }}
        run: |
          tag=$(grep '^RATOS_RELEASE_TAG=' .commrat.env | cut -d= -f2)
          gh release download "${tag}" --repo mattih11/RaTOS \
            --pattern "libreflect-cpp-dev_*.deb" --dir /tmp/pkgs
          sudo dpkg -i /tmp/pkgs/libreflect-cpp-dev_*.deb

      - name: Install SeRTial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo mattih11/SeRTial \
            --pattern "sertial_*_amd64.deb" --dir /tmp/pkgs
          sudo dpkg -i /tmp/pkgs/sertial_*_amd64.deb

      - name: Install CoreRaT (STD)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo mattih11/CoreRaT \
            --pattern "corerat-std_*_amd64.deb" --dir /tmp/pkgs
          sudo dpkg -i /tmp/pkgs/corerat-std_*_amd64.deb

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default --parallel $(nproc)

      - name: Test
        run: |
          corerat-router-tcp > /dev/null 2>&1 &
          sleep 1
          ctest --preset default --output-on-failure
          kill %1 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Job 2: Cross-compile with the EVL platform backend against the RaTOS SDK.
  #        Uses scripts/evl-dev.sh --cross evl-cross which auto-downloads and
  #        caches the ISAR SDK, then builds with cmake --preset evl-cross.
  #        The SDK cache is keyed to RATOS_RELEASE_TAG from .commrat.env.
  # ---------------------------------------------------------------------------
  build-evl-compile:
    name: Build (EVL platform cross-compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release tag
        run: |
          tag=$(grep '^RATOS_RELEASE_TAG=' .commrat.env | cut -d= -f2)
          echo "RATOS_RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Install patchelf
        run: sudo apt-get install -y --no-install-recommends patchelf

      - name: Restore SDK cache
        uses: actions/cache@v4
        with:
          path: |
            .evl-cache/sdk
            .evl-cache/.sdk_cache_key
          key: ratos-sdk-${{ env.RATOS_RELEASE_TAG }}

      - name: Cross-compile (EVL)
        env:
          RATOS_RELEASE_TOKEN: ${{ secrets.RATOS_RELEASE_TOKEN }}
        run: scripts/evl-dev.sh --cross evl-cross

  # ---------------------------------------------------------------------------
  # Job 3: Runtime tests inside a real EVL kernel via QEMU.
  #        Uses scripts/evl-dev.sh --cross evl-cross --test which:
  #          1. Downloads + caches the RaTOS SDK (auto, keyed to release tag)
  #          2. Cross-compiles CommRaT with cmake --preset evl-cross
  #          3. Downloads + caches QEMU kernel/initrd/ext4 artifacts
  #          4. Boots QEMU with the EVL kernel
  #          5. Deploys cross-compiled binaries to the guest
  #          6. Runs all test_* binaries and reports pass/fail
  # ---------------------------------------------------------------------------
  test-evl-runtime:
    name: Runtime tests (EVL kernel via QEMU)
    runs-on: ubuntu-latest
    needs: build-std
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release tag
        run: |
          tag=$(grep '^RATOS_RELEASE_TAG=' .commrat.env | cut -d= -f2)
          echo "RATOS_RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Install QEMU and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 rsync patchelf

      - name: Restore SDK cache
        uses: actions/cache@v4
        with:
          path: |
            .evl-cache/sdk
            .evl-cache/.sdk_cache_key
          key: ratos-sdk-${{ env.RATOS_RELEASE_TAG }}

      - name: Restore QEMU artifacts cache
        uses: actions/cache@v4
        with:
          path: |
            .evl-cache/ratos.ext4
            .evl-cache/vmlinuz
            .evl-cache/initrd.img
            .evl-cache/.cache_key
          key: ratos-qemu-${{ env.RATOS_RELEASE_TAG }}

      - name: Enable KVM access
        run: sudo chmod 666 /dev/kvm

      - name: Cross-compile and run tests in QEMU
        env:
          RATOS_RELEASE_TOKEN: ${{ secrets.RATOS_RELEASE_TOKEN }}
        run: scripts/evl-dev.sh --cross evl-cross --test

  # ---------------------------------------------------------------------------
  # Job 4: Build and publish commrat_<version>_amd64.deb as a release asset.
  #        Only runs on version tags (v*). The .deb installs CommRaT headers,
  #        CMake config, schema-gen helper, and CLI under /usr/local so
  #        downstream repos (RaTGUI) can consume it on bare ubuntu-latest.
  # ---------------------------------------------------------------------------
  publish-deb:
    name: Publish STD package (.deb)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-std
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config

      - name: Install reflectcpp
        env:
          GH_TOKEN: ${{ secrets.RATOS_RELEASE_TOKEN }}
        run: |
          tag=$(grep '^RATOS_RELEASE_TAG=' .commrat.env | cut -d= -f2)
          gh release download "${tag}" --repo mattih11/RaTOS \
            --pattern "libreflect-cpp-dev_*.deb" --dir /tmp/pkgs
          sudo dpkg -i /tmp/pkgs/libreflect-cpp-dev_*.deb

      - name: Install SeRTial
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo mattih11/SeRTial \
            --pattern "sertial_*_amd64.deb" --dir /tmp/pkgs
          sudo dpkg -i /tmp/pkgs/sertial_*_amd64.deb

      - name: Install CoreRaT (STD)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo mattih11/CoreRaT \
            --pattern "corerat-std_*_amd64.deb" --dir /tmp/pkgs
          sudo dpkg -i /tmp/pkgs/corerat-std_*_amd64.deb

      - name: Configure
        run: cmake --preset default -DCMAKE_INSTALL_PREFIX=/usr/local

      - name: Build
        run: cmake --build --preset default --parallel $(nproc)

      - name: Package
        run: cd build/default && cpack -G DEB

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes || true
          gh release upload "${{ github.ref_name }}" \
            build/default/commrat_*.deb --clobber

  # ---------------------------------------------------------------------------
  # Job 5: Publish the cross-compilation SDK as a release asset.
  #        Only runs on version tags (v*). Downloads the SDK installer from
  #        the RaTOS release artifacts and re-publishes it alongside the
  #        CommRaT release so developers can use --cross without building RaTOS.
  # ---------------------------------------------------------------------------
  publish-sdk:
    name: Publish RaTOS SDK (release tags)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-std
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SDK from RaTOS release
        env:
          GH_TOKEN: ${{ secrets.RATOS_RELEASE_TOKEN }}
        run: |
          gh release download \
            --repo mattih11/RaTOS \
            --pattern "ratos-dev-sdk-container-amd64*" \
            --dir sdk-artifact
          ls -lh sdk-artifact/

      - name: Attach SDK to CommRaT release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes || true
          gh release upload "${{ github.ref_name }}" \
            sdk-artifact/ratos-dev-sdk-container-amd64* \
            --clobber
