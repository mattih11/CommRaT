name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The RaTOS dev container image is public (no credentials required to pull).
# Image reference and release repo are defined in .commrat.env and mirrored
# here. Update both files when the RaTOS image changes.
#
# Required GitHub Actions secrets (repo Settings -> Secrets -> Actions):
#   RATOS_RELEASE_TOKEN  PAT with actions:read scope on mattih11/RaTOS
#                        (needed to download workflow run artifacts)

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and test with the standard Linux platform backend.
  #        Runs inside the ratos-dev-image container where all deps are installed.
  # ---------------------------------------------------------------------------
  build-std:
    name: Build & Test (STD platform)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mattih11/ratos-dev-image:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default --parallel $(nproc)

      - name: Test
        run: ctest --preset default

  # ---------------------------------------------------------------------------
  # Job 2: Compile-check with the EVL platform backend.
  #        Expected to fail until evl/threading_impl.hpp and
  #        evl/timestamp_impl.hpp are implemented. continue-on-error keeps
  #        the overall CI green while tracking progress.
  # ---------------------------------------------------------------------------
  build-evl-compile:
    name: Compile check (EVL platform)
    runs-on: ubuntu-latest
    continue-on-error: true  # EVL backends contain #error stubs - not yet implemented
    container:
      image: ghcr.io/mattih11/ratos-dev-image:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (EVL)
        run: cmake --preset evl

      - name: Build (EVL)
        run: cmake --build --preset evl --parallel $(nproc)

  # ---------------------------------------------------------------------------
  # Job 3: Runtime tests inside a real EVL kernel via QEMU.
  #        Downloads the most recent successful RaTOS build artifact from the
  #        mattih11/RaTOS repository, boots the wic image with QEMU, rsyncs
  #        CommRaT source in, builds with the STD platform (all deps present),
  #        and runs ctest.
  #
  #        NOTE: EVL platform runtime tests require the EVL backends to be
  #        implemented first. Until then, STD tests run under the EVL kernel.
  # ---------------------------------------------------------------------------
  test-evl-runtime:
    name: Runtime tests (EVL kernel via QEMU)
    runs-on: ubuntu-latest
    needs: build-std
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 kpartx rsync

      - name: Download RaTOS artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          repo: mattih11/RaTOS
          workflow: build-and-publish.yml
          branch: main
          name: ratos-evl-artifacts
          path: ratos-artifacts
          github_token: ${{ secrets.RATOS_RELEASE_TOKEN }}

      - name: Prepare disk image
        run: |
          cd ratos-artifacts
          ls -lh
          if compgen -G "*.wic.gz" > /dev/null; then gunzip *.wic.gz; fi
          mv *.wic ratos.wic
          mv *vmlinuz vmlinuz

      - name: Generate SSH keypair and inject into image
        run: |
          ssh-keygen -t ed25519 -N "" -f ci_key
          sudo kpartx -av ratos-artifacts/ratos.wic
          sleep 1
          sudo mkdir -p /mnt/ratos
          sudo mount /dev/mapper/loop0p1 /mnt/ratos
          sudo mkdir -p /mnt/ratos/root/.ssh
          sudo cp ci_key.pub /mnt/ratos/root/.ssh/authorized_keys
          sudo chmod 700 /mnt/ratos/root/.ssh
          sudo chmod 600 /mnt/ratos/root/.ssh/authorized_keys
          sudo umount /mnt/ratos
          sudo kpartx -dv ratos-artifacts/ratos.wic

      - name: Start QEMU
        run: |
          qemu-system-x86_64 \
            -kernel ratos-artifacts/vmlinuz \
            -append "root=/dev/vda1 rw console=ttyS0 quiet" \
            -drive file=ratos-artifacts/ratos.wic,format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -m 2G -smp 2 \
            -nographic \
            -serial mon:stdio &
          echo $! > qemu.pid

      - name: Wait for SSH
        run: |
          echo "Waiting for QEMU guest SSH..."
          for i in $(seq 1 90); do
            if ssh -i ci_key \
                -o StrictHostKeyChecking=no \
                -o ConnectTimeout=2 \
                -o BatchMode=yes \
                -p 2222 root@127.0.0.1 true 2>/dev/null; then
              echo "SSH ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Timeout waiting for SSH after 180s" >&2
          exit 1

      - name: Build and test CommRaT in guest
        run: SSH_KEY=ci_key SSH_PORT=2222 bash scripts/ci/run-evl-tests.sh

      - name: Stop QEMU
        if: always()
        run: |
          if [ -f qemu.pid ]; then
            kill "$(cat qemu.pid)" 2>/dev/null || true
          fi
