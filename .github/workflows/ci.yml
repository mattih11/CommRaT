name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUILD_TYPE: Release

# Required GitHub Actions variables (set in repo Settings -> Variables):
#   RATOS_IMAGE_REF       e.g. ghcr.io/myorg/ratos-dev-image:latest
#   RATOS_REGISTRY_USER   e.g. myorg  (GitHub username or org owning the GHCR image)
#   RATOS_RELEASE_REPO    e.g. myorg/RaTOS
#
# Required GitHub Actions secrets (set in repo Settings -> Secrets):
#   RATOS_REGISTRY_TOKEN  PAT or GHCR token with read:packages scope
#   RATOS_RELEASE_TOKEN   PAT with contents:read scope on the RaTOS repo

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and test with the standard Linux platform backend
  #        Runs inside the ratos-dev-image container where all deps are installed.
  # ---------------------------------------------------------------------------
  build-std:
    name: Build & Test (STD platform)
    runs-on: ubuntu-latest
    container:
      image: ${{ vars.RATOS_IMAGE_REF }}
      credentials:
        username: ${{ vars.RATOS_REGISTRY_USER }}
        password: ${{ secrets.RATOS_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }}

      - name: Build
        run: cmake --build build --parallel $(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # ---------------------------------------------------------------------------
  # Job 2: Compile-check with the EVL platform backend
  #        Expected to fail until evl/threading_impl.hpp and
  #        evl/timestamp_impl.hpp are implemented. continue-on-error keeps
  #        the CI green while tracking progress.
  # ---------------------------------------------------------------------------
  build-evl-compile:
    name: Compile check (EVL platform)
    runs-on: ubuntu-latest
    continue-on-error: true  # EVL backends contain #error stubs - not yet implemented
    container:
      image: ${{ vars.RATOS_IMAGE_REF }}
      credentials:
        username: ${{ vars.RATOS_REGISTRY_USER }}
        password: ${{ secrets.RATOS_REGISTRY_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure (EVL)
        run: |
          cmake -B build \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCOMMRAT_PLATFORM=EVL \
            -DCOMMRAT_BUILD_TESTS=OFF \
            -DCOMMRAT_BUILD_EXAMPLES=OFF

      - name: Build (EVL)
        run: cmake --build build --parallel $(nproc)

  # ---------------------------------------------------------------------------
  # Job 3: Runtime tests inside a real EVL kernel via QEMU
  #        Downloads the deployed wic disk image and vmlinuz from the RaTOS
  #        release, boots them with QEMU, rsync CommRaT source in, builds
  #        with the STD platform (all deps present in image), and runs ctest.
  #
  #        NOTE: EVL platform runtime tests require the EVL backends to be
  #        implemented first. Until then, STD tests run under the EVL kernel.
  # ---------------------------------------------------------------------------
  test-evl-runtime:
    name: Runtime tests (EVL kernel via QEMU)
    runs-on: ubuntu-latest
    needs: build-std
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install QEMU and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 kpartx rsync

      - name: Download RaTOS artifacts
        env:
          GH_TOKEN: ${{ secrets.RATOS_RELEASE_TOKEN }}
        run: |
          mkdir ratos-artifacts
          gh release download \
            --repo ${{ vars.RATOS_RELEASE_REPO }} \
            --pattern "*container-amd64-vmlinuz" \
            --pattern "*container-amd64.wic.gz" \
            --dir ratos-artifacts
          ls -lh ratos-artifacts/

      - name: Prepare disk image
        run: |
          cd ratos-artifacts
          gunzip *.wic.gz
          mv *.wic ratos.wic
          mv *-vmlinuz vmlinuz

      - name: Generate SSH keypair and inject into image
        run: |
          ssh-keygen -t ed25519 -N "" -f ci_key
          # Map partitions from the wic image so we can inject the SSH key
          sudo kpartx -av ratos-artifacts/ratos.wic
          # Wait for device nodes to appear
          sleep 1
          sudo mkdir -p /mnt/ratos
          sudo mount /dev/mapper/loop0p1 /mnt/ratos
          sudo mkdir -p /mnt/ratos/root/.ssh
          sudo cp ci_key.pub /mnt/ratos/root/.ssh/authorized_keys
          sudo chmod 700 /mnt/ratos/root/.ssh
          sudo chmod 600 /mnt/ratos/root/.ssh/authorized_keys
          sudo umount /mnt/ratos
          sudo kpartx -dv ratos-artifacts/ratos.wic

      - name: Start QEMU
        run: |
          qemu-system-x86_64 \
            -kernel ratos-artifacts/vmlinuz \
            -append "root=/dev/vda1 rw console=ttyS0 quiet" \
            -drive file=ratos-artifacts/ratos.wic,format=raw,if=virtio \
            -netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -m 2G -smp 2 \
            -nographic \
            -serial mon:stdio &
          echo $! > qemu.pid

      - name: Wait for SSH
        run: |
          echo "Waiting for QEMU guest SSH..."
          for i in $(seq 1 90); do
            if ssh -i ci_key \
                -o StrictHostKeyChecking=no \
                -o ConnectTimeout=2 \
                -o BatchMode=yes \
                -p 2222 root@127.0.0.1 true 2>/dev/null; then
              echo "SSH ready after $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "ERROR: Timeout waiting for SSH after 180s" >&2
          exit 1

      - name: Build and test CommRaT in guest
        run: bash scripts/ci/run-evl-tests.sh

      - name: Stop QEMU
        if: always()
        run: |
          if [ -f qemu.pid ]; then
            kill "$(cat qemu.pid)" 2>/dev/null || true
          fi
