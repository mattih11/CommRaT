name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# The RaTOS dev container image is public (no credentials required to pull).
# Image reference and release repo are defined in .commrat.env and mirrored
# here. Update both files when the RaTOS image changes.
#
# Required GitHub Actions secrets (repo Settings -> Secrets -> Actions):
#   RATOS_RELEASE_TOKEN  PAT with actions:read scope on mattih11/RaTOS
#                        (needed to download workflow run artifacts)

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Build and test with the standard Linux platform backend.
  #        Runs inside the ratos-dev-image container where all deps are installed.
  # ---------------------------------------------------------------------------
  build-std:
    name: Build & Test (STD platform)
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mattih11/ratos-dev-image:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset default

      - name: Build
        run: cmake --build --preset default --parallel $(nproc)

      - name: Test
        run: |
          corerat-router-tcp > /dev/null 2>&1 &
          sleep 1
          ctest --preset default
          kill %1 2>/dev/null || true

  # ---------------------------------------------------------------------------
  # Job 2: Cross-compile with the EVL platform backend against the RaTOS SDK.
  #        Uses scripts/evl-dev.sh --cross evl-cross which auto-downloads and
  #        caches the ISAR SDK, then builds with cmake --preset evl-cross.
  #        The SDK cache is keyed to RATOS_RELEASE_TAG from .commrat.env.
  # ---------------------------------------------------------------------------
  build-evl-compile:
    name: Build (EVL platform cross-compile)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release tag
        run: |
          tag=$(grep '^RATOS_RELEASE_TAG=' .commrat.env | cut -d= -f2)
          echo "RATOS_RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Install patchelf
        run: sudo apt-get install -y --no-install-recommends patchelf

      - name: Restore SDK cache
        uses: actions/cache@v4
        with:
          path: |
            .evl-cache/sdk
            .evl-cache/.sdk_cache_key
          key: ratos-sdk-${{ env.RATOS_RELEASE_TAG }}

      - name: Cross-compile (EVL)
        env:
          RATOS_RELEASE_TOKEN: ${{ secrets.RATOS_RELEASE_TOKEN }}
        run: scripts/evl-dev.sh --cross evl-cross

  # ---------------------------------------------------------------------------
  # Job 3: Runtime tests inside a real EVL kernel via QEMU.
  #        Uses scripts/evl-dev.sh --cross evl-cross --test which:
  #          1. Downloads + caches the RaTOS SDK (auto, keyed to release tag)
  #          2. Cross-compiles CommRaT with cmake --preset evl-cross
  #          3. Downloads + caches QEMU kernel/initrd/ext4 artifacts
  #          4. Boots QEMU with the EVL kernel
  #          5. Deploys cross-compiled binaries to the guest
  #          6. Runs all test_* binaries and reports pass/fail
  # ---------------------------------------------------------------------------
  test-evl-runtime:
    name: Runtime tests (EVL kernel via QEMU)
    runs-on: ubuntu-latest
    needs: build-std
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release tag
        run: |
          tag=$(grep '^RATOS_RELEASE_TAG=' .commrat.env | cut -d= -f2)
          echo "RATOS_RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - name: Install QEMU and tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 rsync patchelf

      - name: Restore SDK cache
        uses: actions/cache@v4
        with:
          path: |
            .evl-cache/sdk
            .evl-cache/.sdk_cache_key
          key: ratos-sdk-${{ env.RATOS_RELEASE_TAG }}

      - name: Restore QEMU artifacts cache
        uses: actions/cache@v4
        with:
          path: |
            .evl-cache/ratos.ext4
            .evl-cache/vmlinuz
            .evl-cache/initrd.img
            .evl-cache/.cache_key
          key: ratos-qemu-${{ env.RATOS_RELEASE_TAG }}

      - name: Cross-compile and run tests in QEMU
        env:
          RATOS_RELEASE_TOKEN: ${{ secrets.RATOS_RELEASE_TOKEN }}
        run: scripts/evl-dev.sh --cross evl-cross --test

  # ---------------------------------------------------------------------------
  # Job 4: Publish the cross-compilation SDK as a release asset.
  #        Only runs on version tags (v*). Downloads the SDK installer from
  #        the RaTOS release artifacts and re-publishes it alongside the
  #        CommRaT release so developers can use --cross without building RaTOS.
  # ---------------------------------------------------------------------------
  publish-sdk:
    name: Publish RaTOS SDK (release tags)
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download SDK from RaTOS release
        env:
          GH_TOKEN: ${{ secrets.RATOS_RELEASE_TOKEN }}
        run: |
          # Find the most recent RaTOS release that has the SDK asset
          gh release download \
            --repo mattih11/RaTOS \
            --pattern "ratos-dev-sdk-container-amd64*" \
            --dir sdk-artifact
          ls -lh sdk-artifact/

      - name: Attach SDK to CommRaT release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            sdk-artifact/ratos-dev-sdk-container-amd64* \
            --clobber
